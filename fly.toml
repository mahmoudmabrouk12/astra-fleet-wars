# fly.toml app configuration file generated for astra-fleet-wars on 2026-10-27T16:35:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'astra-fleet-wars'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
