services:
  - type: web
    name: astra-fleet-wars-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 5000
      - key: Jwt__Secret
        generateValue: true
      - key: Supabase__Url
        sync: false
      - key: Supabase__AnonKey
        sync: false
